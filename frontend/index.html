<!DOCTYPE html>
<html>
<head>
  <title>Crop Recommendation</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<header>
  <div class="header-content">
    <div class="header-text">
      <h1>🌱 Smart Crop Recommendation</h1>
      <p>AI-powered solution for farmers</p>
    </div>

    <div class="top-bar">
  <span id="welcomeUser"></span>
  <button onclick="toggleDark()">🌙</button> <!-- ✅ ADD HERE -->
  <button onclick="logout()">Logout</button>
</div>

  </div>
</header>

<div class="container">
  <div class="card">
    
    <form id="cropForm">
      <div class="grid">
        <input id="N" placeholder="Nitrogen" required>
        <input id="P" placeholder="Phosphorus" required>
        <input id="K" placeholder="Potassium" required>
        <input id="temperature" placeholder="Temperature" required>
        <input id="humidity" placeholder="Humidity" required>
        <input id="ph" step="0.01" placeholder="pH" required>
        <input id="rainfall" placeholder="Rainfall" required>
      </div>
        <button type="button" onclick="getWeather()">📍 Use My Location</button>
      <button type="submit">🌾 Predict Crop</button>
    </form>

    <div id="result" class="result"></div>
    

  </div>
</div>

<footer>
  © 2026 Smart Agriculture Project
</footer>

<script src="script.js"></script>
</body>
</html>
